[package]
name = "simpleminimap"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
description = "A tiny asynchronous minimap renderer for Vim 9"
license = "MIT"
repository = "https://github.com/beamiter/simpleminimap"
readme = "README.md"
keywords = ["vim", "minimap", "editor", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "simpleminimap-daemon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
