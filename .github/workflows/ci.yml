name: ci

on:
  push:
  pull_request:

jobs:
  # The MSRV toolchain is derived from Cargo.toml rather than written here.
  # A hardcoded pin silently drifts: this job sat at 1.85.0 while Cargo.toml
  # declared rust-version = "1.88", and cargo treats a higher declared
  # rust-version as a hard error, so every run failed before compiling
  # anything.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rust-version
        name: Read the declared MSRV from Cargo.toml
        run: |
          version="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version" || { echo "Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV from Cargo.toml: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Check against the declared minimum supported Rust
        run: cargo check --all-targets --locked

  # One step, because the Makefile is the source of truth for what the gate
  # is.  Hand-listing a subset here is how `make core-verify` and two whole
  # Vim suites stayed out of CI while looking covered.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim-nox
      - name: make check
        run: make check
      - name: Vim assertion failures
        if: failure()
        run: cat tests/vim-errors.log || true
